<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI파수꾼 타이틀</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1a12; color: #fff;
    font-family: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 14s ease-in-out infinite alternate; }
  .b1 { width: 900px; height: 900px; left: -200px; top: -250px; background: #0B8F4A; }
  .b2 { width: 760px; height: 760px; right: -180px; bottom: -260px; background: #1f6b46; animation-delay: -5s; }
  .b3 { width: 520px; height: 520px; left: 55%; top: 20%; background: #12422b; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(120px, 80px) scale(1.15); } }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%); }
  .scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .scene.on { display: flex; }
  .in { opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  .pop { opacity: 0; animation: pop .9s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  .kicker { font-size: 30px; font-weight: 800; color: #5FD08F; letter-spacing: 6px; }
  .logo { width: 150px; height: 150px; border-radius: 40px; background: #0B8F4A; display: grid; place-items: center; box-shadow: 0 0 0 14px rgba(11,143,74,.18), 0 30px 80px rgba(0,0,0,.4); margin-bottom: 44px; }
  .logo svg { width: 96px; height: 96px; }
  h1 { font-size: 150px; font-weight: 900; letter-spacing: -4px; line-height: 1; }
  .sub { font-size: 46px; font-weight: 600; color: #d4e8dc; margin-top: 34px; line-height: 1.4; }
  .lines { display: flex; flex-direction: column; gap: 34px; align-items: center; }
  .line { font-size: 54px; font-weight: 700; color: #cfe3d6; letter-spacing: -1px; }
  .line b { color: #fff; }
  .big { font-size: 84px; font-weight: 900; letter-spacing: -2px; margin-top: 30px; }
  .big em { font-style: normal; color: #5FD08F; }
  .bar { width: 0; height: 6px; background: #5FD08F; border-radius: 3px; margin: 30px auto 0; animation: bar 1s .5s forwards; }
  @keyframes bar { to { width: 220px; } }
  .num { font-size: 40px; font-weight: 900; color: #5FD08F; margin-bottom: 18px; }
  .btitle { font-size: 110px; font-weight: 900; letter-spacing: -3px; }
  .bdesc { font-size: 40px; color: #cfe3d6; margin-top: 26px; font-weight: 600; }
  .chips { display: flex; gap: 20px; margin-top: 54px; }
  .chip { font-size: 32px; font-weight: 700; padding: 16px 32px; border-radius: 999px; border: 2px solid #2f8a5a; color: #d9f0e2; background: rgba(11,143,74,.15); }
  .url { margin-top: 60px; font-size: 28px; color: #8fb7a0; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div></div>

<section class="scene" id="intro">
  <div class="logo pop"><svg viewBox="0 0 64 64"><path d="M32 5 54 13v16c0 15-9.5 25.5-22 30C19.5 54.5 10 44 10 29V13z" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M22 32.5 29 39.5 43 25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1 class="in" style="animation-delay:.35s">AI파수꾼</h1>
  <p class="sub in" style="animation-delay:.8s">송금 직전, AI가 보이스피싱 정황을 한 번 더 확인합니다</p>
  <div class="bar"></div>
  <p class="kicker in" style="animation-delay:1.4s;margin-top:40px">AI AGENT 챌린지 · 시연 영상</p>
</section>

<section class="scene" id="problem">
  <div class="lines">
    <p class="line in" style="animation-delay:.2s">보이스피싱 피해자는 속아서 <b>‘직접’ 송금</b>합니다</p>
    <p class="line in" style="animation-delay:1.6s">기존 FDS는 <b>본인이 맞는지</b>만 확인해요</p>
    <p class="big in" style="animation-delay:3.4s">그래서 <em>송금 직전</em>, AI가 한 번 더 묻습니다</p>
  </div>
</section>

<section class="scene" id="bumper">
  <p class="num in" id="bnum"></p>
  <p class="btitle in" style="animation-delay:.15s" id="btitle"></p>
  <p class="bdesc in" style="animation-delay:.35s" id="bdesc"></p>
</section>

<section class="scene" id="outro">
  <p class="big in" style="margin:0">막지 않고, <em>멈추게</em> 합니다</p>
  <div class="chips">
    <span class="chip in" style="animation-delay:.6s">룰 11개 송금위험도</span>
    <span class="chip in" style="animation-delay:.8s">AI 대화 · 사례 RAG</span>
    <span class="chip in" style="animation-delay:1s">영업점 · 본부 연계</span>
  </div>
  <div class="logo pop" style="margin:70px 0 0;width:110px;height:110px;border-radius:30px;animation-delay:1.4s"><svg viewBox="0 0 64 64" style="width:70px;height:70px"><path d="M32 5 54 13v16c0 15-9.5 25.5-22 30C19.5 54.5 10 44 10 29V13z" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M22 32.5 29 39.5 43 25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <p class="kicker in" style="animation-delay:1.7s;margin-top:26px;font-size:40px;letter-spacing:4px">AI파수꾼</p>
  <p class="url in" style="animation-delay:2s">frontend-xi-mocha-54.vercel.app</p>
</section>

<script>
  const q = new URLSearchParams(location.search);
  const s = q.get("s") || "intro";
  document.getElementById(s).classList.add("on");
  if (s === "bumper") {
    document.getElementById("bnum").textContent = q.get("n") || "";
    document.getElementById("btitle").textContent = q.get("t") || "";
    document.getElementById("bdesc").textContent = q.get("d") || "";
  }
</script>
</body>
</html>
